      text-decoration: none;
      box-shadow: 0 10px 24px rgba(196, 92, 74, 0.38);

    a.call:active { transform: scale(0.98); }

      margin-top: 36px;

<body>
  <div class="mark" role="img" aria-label="Call Allie"></div>
  <h1>Call Allie</h1>
  <p class="status" id="status">Starting the call…</p>
  <a class="call" id="callBtn" href="tel:+16145723089">Call Allie</a>
  <p class="hint" id="hint">If the call does not start on its own, tap the button. On iPhone, open this page in Safari, then tap Share and Add to Home Screen.</p>
  <script>
    (function () {
      var TEL = "tel:+16145723089";
      var statusEl = document.getElementById("status");
      var standalone = window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
      if (standalone) document.body.className += " standalone";

      function startCall() {
        window.location.href = TEL;
      }

      window.addEventListener("pageshow", function (e) {
        if (e.persisted) {
          statusEl.textContent = "Tap the button to call again.";
          return;
        }
        statusEl.textContent = "Starting the call…";
        setTimeout(startCall, 250);
      });

      document.getElementById("callBtn").addEventListener("click", function () {
        statusEl.textContent = "Starting the call…";
      });
    })();
  </script>
</body>
